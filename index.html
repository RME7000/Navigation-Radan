<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cabuyao Custom Navigation V6</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111}
#map{position:absolute;inset:0;background:#dfe3e8}.top{position:absolute;z-index:1000;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:#151515eF;color:white;border:0;border-radius:17px;padding:10px 13px;font-size:12px;font-weight:800;box-shadow:0 4px 18px #0005;pointer-events:auto}.title span{display:block;color:#aaa;font-size:10px;margin-top:3px}
.actions{display:flex;gap:7px}.help,.notice{position:absolute;z-index:1001;top:67px;background:#111;color:#fff;border-radius:12px;padding:8px 11px;font-size:10px;font-weight:800;box-shadow:0 4px 15px #0006}.help{right:14px}.notice{left:50%;transform:translateX(-50%);display:none;white-space:nowrap}
.bottom{position:absolute;z-index:1000;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));background:#121212F5;color:#fff;border-radius:24px;padding:13px 14px;box-shadow:0 8px 30px #0008;backdrop-filter:blur(14px)}
.mode{display:flex;gap:7px;margin-bottom:10px}.mode button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:900;background:#292929;color:#aaa}.mode button.active{background:#fff;color:#111}
.next{display:flex;gap:11px;align-items:center;border-bottom:1px solid #ffffff18;padding-bottom:10px}.turn{width:45px;height:45px;border-radius:14px;background:#fff;color:#111;display:grid;place-items:center;font-size:23px;font-weight:900}.next small{color:#aaa;font-size:10px}.next strong{display:block;font-size:16px;margin-top:3px}
.stats{display:flex;justify-content:space-between;align-items:end;padding-top:10px}.stat b{font-size:21px}.stat span{display:block;color:#999;font-size:10px;margin-top:2px}.mainbtn{border:0;border-radius:13px;padding:12px 15px;font-weight:900;background:#27d17f;color:#07140d}.danger{background:#ff453a;color:white}
.handle{width:18px;height:18px;border-radius:50%;background:white;border:4px solid #147aff;box-shadow:0 2px 8px #0007}.user{width:25px;height:25px;border-radius:50%;background:#147aff;border:4px solid white;box-shadow:0 2px 12px #0008}
</style>
</head>
<body>
<div id="map"></div>
<div class="top"><div class="pill title">CUSTOM NAVIGATION<span>CABUYAO CITY • VERSION 6</span></div>
<div class="actions"><button class="pill" id="gps">⌖ GPS</button><button class="pill" id="save">SAVE ROUTE</button><button class="pill" id="share">SHARE ROUTE</button><button class="pill" id="clear">CLEAR</button></div></div>
<div class="help" id="help">Tap map → add waypoints → route follows roads</div><div class="notice" id="mapStatus">Loading map…</div><div class="notice" id="notice"></div>
<div class="bottom">
<div class="mode"><button id="edit" class="active">EDIT ROUTE</button><button id="nav">NAVIGATION</button></div>
<div class="next"><div class="turn" id="icon">＋</div><div><small id="label">ROUTE BUILDER</small><strong id="instruction">Tap the map to add your first point</strong></div></div>
<div class="stats"><div class="stat"><b id="points">0</b><span>POINTS / ETA</span></div><div class="stat"><b id="distance">0 m</b><span>ROAD ROUTE</span></div><button class="mainbtn" id="start">START</button></div>
<div style="display:flex;gap:7px;margin-top:9px"><button class="pill" id="load" style="flex:1">LOAD SAVED</button><button class="pill" id="new" style="flex:1">NEW ROUTE</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const IMPORTED_ROUTE = [[14.26186934344688,121.13248318433763],[14.261575594890372,121.13210499286653],[14.260270618799268,121.13266021013261],[14.259423160160443,121.13286674022676],[14.25930098027798,121.13245368003847],[14.258216955867846,121.13275945186616],[14.257533263931403,121.1304393410683],[14.256509021942167,121.13076925277711],[14.256095684390353,121.12907946109772]];
const CABUYAO=[14.2700,121.1250];
const map=L.map('map').setView(CABUYAO,14);
const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'© OpenStreetMap contributors',crossOrigin:true
});
const carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
 maxZoom:20,attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',crossOrigin:true
});
osm.on('tileerror',()=>{if(!map.hasLayer(carto)){map.addLayer(carto);}});
osm.on('load',()=>{const s=document.getElementById('mapStatus');if(s)s.style.display='none';});
carto.on('load',()=>{const s=document.getElementById('mapStatus');if(s)s.style.display='none';});
osm.addTo(map);

let pts=[],markers=[],line=L.polyline([],{color:'#147aff',weight:8,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map);
let user=null,watch=null,navigating=false,current=null,roadGeometry=[],routeSteps=[],routingTimer=null;

function dist(a,b){const R=6371000,p=Math.PI/180,dl=(b[0]-a[0])*p,dn=(b[1]-a[1])*p;const x=Math.sin(dl/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function total(){let d=0;for(let i=1;i<roadGeometry.length;i++)d+=dist(roadGeometry[i-1],roadGeometry[i]);return roadGeometry.length?d:0}
function fmt(m){return m>=1000?(m/1000).toFixed(1)+' km':Math.round(m)+' m'}
function msg(s){const n=document.getElementById('notice');n.textContent=s;n.style.display='block';clearTimeout(msg.t);msg.t=setTimeout(()=>n.style.display='none',2500)}
function refresh(){
 line.setLatLngs(roadGeometry.length?roadGeometry:pts);
 document.getElementById('points').textContent=pts.length;
 document.getElementById('distance').textContent=fmt(total());
 document.getElementById('instruction').textContent=pts.length===0?'Tap the map to add your first point':pts.length===1?'Add a destination or waypoint':'Calculating road route…';
 document.getElementById('icon').textContent=pts.length?'↗':'＋';
 if(pts.length>=2) requestRoadRoute();
}
async function requestRoadRoute(){
 clearTimeout(routingTimer);
 routingTimer=setTimeout(async()=>{
  const coords=pts.map(p=>p[1]+','+p[0]).join(';');
  const url='https://router.project-osrm.org/route/v1/driving/'+coords+'?overview=full&geometries=geojson&steps=true&alternatives=false&continue_straight=default';
  try{
   const res=await fetch(url);
   const data=await res.json();
   if(data.code!=='Ok'||!data.routes?.length) throw new Error('No route');
   const r=data.routes[0];
   roadGeometry=r.geometry.coordinates.map(c=>[c[1],c[0]]);
   routeSteps=(r.legs||[]).flatMap(l=>l.steps||[]);
   line.setLatLngs(roadGeometry);
   document.getElementById('distance').textContent=fmt(r.distance);
   const mins=Math.max(1,Math.round(r.duration/60));
   document.getElementById('points').textContent=mins+' min';
   document.getElementById('instruction').textContent='Road route ready • '+pts.length+' waypoints';
   document.getElementById('icon').textContent='↗';
  }catch(e){
   roadGeometry=[];
   line.setLatLngs(pts);
   document.getElementById('instruction').textContent='Could not calculate road route';
   msg('Road routing needs an internet connection');
  }
 },180);
}
function addPoint(p){
 if(navigating)return;pts.push([p.lat,p.lng]);
 const m=L.marker(p,{draggable:true,icon:L.divIcon({className:'',html:'<div class="handle"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
 m.bindTooltip(String(pts.length),{permanent:true,direction:'top',offset:[0,-8]});
 m.on('drag',()=>{const i=markers.indexOf(m),q=m.getLatLng();pts[i]=[q.lat,q.lng];refresh()});
 markers.push(m);refresh()
}
map.on('click',e=>addPoint(e.latlng));

function clearRoute(){pts=[];roadGeometry=[];routeSteps=[];markers.forEach(m=>map.removeLayer(m));markers=[];line.setLatLngs([]);navigating=false;stopGPS();document.getElementById('start').textContent='START';document.getElementById('start').className='mainbtn';document.getElementById('help').style.display='block';refresh();msg('Route cleared')}
document.getElementById('clear').onclick=clearRoute;
document.getElementById('edit').onclick=()=>{if(!navigating){document.getElementById('edit').classList.add('active');document.getElementById('nav').classList.remove('active');document.getElementById('help').style.display='block'}};
document.getElementById('nav').onclick=()=>{if(pts.length>=2){document.getElementById('edit').classList.remove('active');document.getElementById('nav').classList.add('active');document.getElementById('help').style.display='none'}else msg('Add at least 2 points first')};

function gpsUpdate(pos){
 current=[pos.coords.latitude,pos.coords.longitude];
 if(!user)user=L.marker(current,{icon:L.divIcon({className:'',html:'<div class="user"></div>',iconSize:[25,25],iconAnchor:[12.5,12.5]})}).addTo(map);else user.setLatLng(current);
 if(navigating&&pts.length){
 const target=pts[pts.length-1],rem=dist(current,target);
 const speed=pos.coords.speed&&pos.coords.speed>1?pos.coords.speed:8.33;
 document.getElementById('distance').textContent=fmt(rem);
 document.getElementById('points').textContent=Math.max(1,Math.round(rem/speed/60))+' min';
 document.getElementById('label').textContent='LIVE GPS';
 let text=rem<40?'You have arrived':'Follow the blue road route';
 if(routeSteps.length){
   const s=routeSteps[0];
   if(s.maneuver&&s.maneuver.type==='turn') text=(s.maneuver.modifier||'Turn')+' • '+(s.name||'next road');
   else if(s.name) text='Continue on '+s.name;
 }
 document.getElementById('instruction').textContent=text;
 document.getElementById('icon').textContent=rem<40?'✓':'↗';
 map.setView(current,17)
}
}
function startGPS(){if(!navigator.geolocation)return msg('GPS is not supported');if(watch!==null)return;watch=navigator.geolocation.watchPosition(gpsUpdate,()=>msg('Allow location access for GPS'),{enableHighAccuracy:true,maximumAge:3000,timeout:10000});navigator.geolocation.getCurrentPosition(gpsUpdate,()=>{},{enableHighAccuracy:true,timeout:10000})}
function stopGPS(){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}}
document.getElementById('gps').onclick=()=>{startGPS();if(current)map.setView(current,17);else msg('Requesting GPS location…')};
document.getElementById('start').onclick=()=>{if(navigating){navigating=false;stopGPS();document.getElementById('start').textContent='START';document.getElementById('start').className='mainbtn';document.getElementById('edit').classList.add('active');document.getElementById('nav').classList.remove('active');document.getElementById('help').style.display='block';refresh();msg('Navigation stopped');return}
if(pts.length<2)return msg('Tap at least 2 points on the map first');navigating=true;startGPS();document.getElementById('start').textContent='STOP';document.getElementById('start').className='mainbtn danger';document.getElementById('edit').classList.remove('active');document.getElementById('nav').classList.add('active');document.getElementById('help').style.display='none';msg('Custom navigation started')};
refresh();startGPS();
if(IMPORTED_ROUTE&&IMPORTED_ROUTE.length>=2){
  roadGeometry=[];
  line.setLatLngs(pts);
  map.fitBounds(L.latLngBounds(pts),{padding:[70,100]});
  requestRoadRoute();
}

function routeData(name){
 return {version:2,name:name||'Cabuyao Route',created:new Date().toISOString(),points:pts.map(p=>({lat:p[0],lng:p[1]}))};
}
function downloadRoute(){
 if(pts.length<2)return msg('Create at least 2 points before saving');
 const name=prompt('Route name:','Cabuyao Route');
 if(name===null)return;
 const safe=name.trim().replace(/[^a-z0-9_-]+/gi,'_')||'cabuyao_route';
 const routeJSON=JSON.stringify(pts);
 const marker='const IMPORTED_ROUTE = null;';
 const replacement='const IMPORTED_ROUTE = '+routeJSON+';';
 const exported=document.documentElement.outerHTML.replace(marker,replacement);
 const blob=new Blob(['<!doctype html>\n'+exported],{type:'text/html'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=safe+'.html';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 msg('Saved as a standalone HTML route');
}
async function shareRoute(){
 if(pts.length<2)return msg('Create at least 2 points before sharing');
 const exported=document.documentElement.outerHTML.replace('const IMPORTED_ROUTE = null;','const IMPORTED_ROUTE = '+JSON.stringify(pts)+';');
 const blob=new Blob(['<!doctype html>\n'+exported],{type:'text/html'});
 const file=new File([blob],'cabuyao_route.html',{type:'text/html'});
 if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
  try{await navigator.share({title:'Cabuyao Custom Route',text:'Open this HTML file in a browser to view the route.',files:[file]});return}catch(e){}
 }
 // Fallback: save the same standalone route file.
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cabuyao_route.html';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 msg('Route exported as an HTML file');
}
function loadRouteFile(file){
 const reader=new FileReader();
 reader.onload=()=>{
  try{
   let raw=reader.result, data;
   try { data=JSON.parse(raw); }
   catch(e){
    const match=raw.match(/const IMPORTED_ROUTE\s*=\s*(\[[\s\S]*?\]);/);
    if(!match)throw new Error();
    data={points:JSON.parse(match[1]).map(x=>({lat:x[0],lng:x[1]}))};
   }
   if(!Array.isArray(data.points)||data.points.length<2)throw new Error();
   pts=data.points.map(x=>[Number(x.lat),Number(x.lng)]);
   markers.forEach(m=>map.removeLayer(m));markers=[];
   pts.forEach((p,i)=>{
    const m=L.marker(p,{draggable:true,icon:L.divIcon({className:'',html:'<div class="handle"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
    m.bindTooltip(String(i+1),{permanent:true,direction:'top',offset:[0,-8]});
    m.on('drag',()=>{const j=markers.indexOf(m),q=m.getLatLng();pts[j]=[q.lat,q.lng];refresh()});
    markers.push(m);
   });
   roadGeometry=[];line.setLatLngs(pts);map.fitBounds(line.getBounds(),{padding:[70,100]});refresh();msg('Route loaded — calculating road route');
  }catch(e){msg('Invalid route file')}
 };
 reader.readAsText(file);
}
document.getElementById('save').onclick=downloadRoute;
document.getElementById('share').onclick=shareRoute;
document.getElementById('load').onclick=()=>{
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.onchange=()=>{if(input.files[0])loadRouteFile(input.files[0])};input.click();
};
document.getElementById('new').onclick=clearRoute;

</script>
</body>
</html>
